name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A51C7B: ${{ secrets.A51C7B }}
          B8BF42: ${{ secrets.B8BF42 }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('A51C7B', '')
          env_b = os.environ.get('B8BF42', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- a067d460510f8b51a8adc203d0359a8deb75d293 -->', env_a)
          if env_b:
              result = result.replace('<!-- a83c7d06d3f78b182d50ec566fe675601c947fc7d61d79 -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
